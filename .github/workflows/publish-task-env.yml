name: Publish Task Environment Images

on:
  push:
    branches:
      - codex/agentbeats-skillsbench-leaderboard
    paths:
      - '.github/workflows/publish-task-env.yml'
      - 'prebuilt/citation-check-environment/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push citation-check task environment
        uses: docker/build-push-action@v6
        with:
          context: prebuilt/citation-check-environment
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yiminnn/skillsbench-citation-check-env:agentbeats-smoke
          labels: |
            org.opencontainers.image.source=https://github.com/Yiminnn/skillsbench-agentbeats
            org.opencontainers.image.description=SkillsBench citation-check AgentBeats smoke task environment
